<!DOCTYPE html>
<html>
<head>
  <title>CheckCred Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>CheckCred</h2>
    <p class="subtitle">Maximize your rewards.</p>

    <div id="cart-data-section">
      <div class="input-group">
        <label>Amount ($)</label>
        <input type="number" step="0.01" id="amount-input" />
      </div>
      <div class="input-group">
        <label>Category</label>
        <input type="text" id="category-input" />
      </div>
      <div class="input-group" style="display: none;">
        <label>Coupons Found (comma separated)</label>
        <input type="text" id="coupons-input" placeholder="e.g. SAVE20" />
      </div>
      
      <button id="get-recommendation-btn" class="primary-btn">Get Best Card</button>
      
      <div class="settings-section" style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #eee;">
        <div class="input-group">
          <label>API Token (from Profile)</label>
          <input type="password" id="api-token-input" placeholder="Paste your token here" />
        </div>
        <button id="save-token-btn" class="secondary-btn" style="margin-top: 5px; font-size: 12px; padding: 4px 8px;">Save Token</button>
        <span id="token-status" style="font-size: 12px; color: green; margin-left: 10px; display: none;">Saved!</span>
      </div>
    </div>

    <div id="loading" class="hidden">
      Analyzing your cards...
    </div>

    <div id="result-section" class="hidden">
      <h3>Recommended Card:</h3>
      <div id="best-card-name" class="card-name"></div>
      <div id="best-card-amount" class="reward-amount" style="font-size: 20px; font-weight: bold; color: #d97706; margin-top: 5px;"></div>
      <p id="best-card-rewards" class="rewards-text"></p>
      <p id="best-card-reasoning" class="reasoning-text"></p>
      
      <button id="reset-btn" class="secondary-btn">Back</button>
    </div>
    
    <div id="error-message" class="error hidden"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
